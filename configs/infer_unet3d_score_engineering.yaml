# High-score self-trained inference profile.
# The multiseed runner will generate fully resolved candidate configs with 1/2/3/4 checkpoints.
# This base config stays runnable on its own with the current best self-trained checkpoint.

data_root: inputs
ids_csv: inputs/splits/val_case_days.csv
train_csv: inputs/train.csv

weights: "outputs/20260318-114555_Unet3D_ref_loss_diceBCE_epoch_150/best.pt"
output_dir: ""

out_csv_name: submit.csv
export_pred_nifti: false
pred_nifti_dir_name: pred_nifti

evaluate: true
eval_per_case_name: eval_per_case.csv
eval_summary_name: eval_summary.json

roi_d: 96
roi_h: 224
roi_w: 224
sw_batch_size: 2
overlap: 0.5
sw_mode: gaussian
sw_sigma_scale: 0.125
threshold: 0.5
tta_flips:
  - [1]
  - [2]
  - [1, 2]
intensity_norm: safe_unit_scale
pad_to_roi: true

num_workers: 0
device: ""
unsafe_load: false
