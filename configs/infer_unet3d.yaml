# Inference config for the 3D U-Net baseline (`scripts/infer_unet3d.py`).
#
# Set `weights` to a checkpoint (e.g., `outputs/<run>/best.pt`) and choose a split via `ids_csv`.

# Data (Kaggle-style dataset under `data_root`)
data_root: inputs
ids_csv: inputs/splits/val_case_days.csv
train_csv: inputs/train.csv  # required when evaluate: true

# Weights / outputs
# Set this (or pass `--weights`) before running.
weights: ""
# If empty, defaults to: <weights_parent>/infer
# Tip: set explicitly to avoid mixing multiple inference runs.
output_dir: ""

# Output filenames
out_csv_name: submit.csv

# If true: decodes GT masks from train_csv and writes Dice summaries.
evaluate: true
eval_per_case_name: eval_per_case.csv
eval_summary_name: eval_summary.json

# Sliding-window inference
# Keep these consistent with training patch size unless you have a reason to change.
roi_d: 96
roi_h: 224
roi_w: 224
sw_batch_size: 2
overlap: 0.25
threshold: 0.5

# Runtime
num_workers: 0
device: ""  # e.g. "cuda:0" or "cpu"; empty = auto

# Checkpoint loading
# Leave false unless you trust the checkpoint source and need a full (unsafe) load.
unsafe_load: false
