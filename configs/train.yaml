# Training config
# Usage: bash scripts/run_train.sh configs/train.yaml

data_root: /home/jeremiah/github/UW-Madison_GI_Tract_Image_Segmentation/inputs
# Use `{ts}` and `{run_name}` so each run gets a unique output folder automatically.
run_dir: ./outputs/{experiment}/{ts}-{run_name}

epochs: 30
batch_size: 8
lr: 0.0005

patch_d: 96
patch_h: 96
patch_w: 96
samples_per_volume: 12
cache_in_ram: false

train_fg_ratio: 0.7
train_fg_min_voxels: 16
train_fg_jitter: 16

# Optional: full-volume validation via sliding-window inference (slow).
val_sw_every: 5
best_metric: sw
val_sw_overlap: 0.25
val_sw_batch_size: 1

# Val visualization (TensorBoard): log fixed GT vs Pred slices.
# Uses a pre-generated sample list under ./outputs/eval (do not re-sample during training).
val_vis_every: 1
val_vis_n: 16
val_vis_threshold: 0.5
val_vis_samples: /home/jeremiah/github/UW-Madison_GI_Tract_Image_Segmentation/inputs/splits/val_vis_samples.json

model: unet
feature_size: 48
use_checkpoint: false
init_from: null

num_workers: 4
seed: 42
val_ratio: 0.2

# Optional: explicit split (overrides val_ratio split). Files can be csv/txt/json.
train_ids: /home/jeremiah/github/UW-Madison_GI_Tract_Image_Segmentation/inputs/splits/train_case_days.csv
val_ids: /home/jeremiah/github/UW-Madison_GI_Tract_Image_Segmentation/inputs/splits/val_case_days.csv
# ids_column: case_day
mixed_precision: fp16
use_tensorboard: true
tb_dir: ./outputs/train_run/tb
log_steps: 50

use_mlflow: true
# Pin MLflow to the repo-local sqlite backend so UI always finds your experiments.
mlflow_tracking_uri: "sqlite:////home/jeremiah/github/UW-Madison_GI_Tract_Image_Segmentation/mlflow.db"
mlflow_experiment: uwgi_train_unet
mlflow_run_name: 3dunet-c1-patch80-dicece-baseline
save_last_every: 1

debug: false
