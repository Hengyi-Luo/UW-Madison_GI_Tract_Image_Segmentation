# Default training config (100 epochs).

# data
data_root: inputs
train_ids: inputs/splits/train_case_days.csv
val_ids: inputs/splits/val_case_days.csv
num_workers: 6
seed: 42

# output / resume
# If empty, an output dir is created under outputs/ with a timestamp prefix.
output_dir: ""
resume_from: ""

# tracking (MLflow)
use_mlflow: true
allow_dirty_git: true
# Optional overrides (otherwise uses $MLFLOW_TRACKING_URI / $MLFLOW_EXPERIMENT_NAME or repo defaults).
mlflow_tracking_uri: "sqlite:///./mlflow.db"
mlflow_experiment: "uwgi/segmentation"

# model
model_name: Unet3D
spatial_dims: 3
in_channels: 1
out_channels: 3

# patches
patch_d: 96
patch_h: 224
patch_w: 224

# optimizer
lr: 1.0e-4
weight_decay: 1.0e-4

# OneCycleLR
lr_max: 5.0e-4
lr_pct_start: 0.2
lr_div_factor: 25
lr_final_div_factor: 1000

# training
epochs: 100
val_interval: 5
train_patch_metrics_interval: 0  # 0 disables full-train patch eval during validation
val_hd95_interval: 0  # disable HD95 during training-time validation; infer still computes it
mixed_precision: fp16  # no | fp16 | bf16
train_batch_size: 8
val_batch_size: 1

# val (sliding window)
sw_batch_size: 2
sw_overlap: 0.25

# visualization (TensorBoard images)
val_vis_every: 10
val_vis_samples: inputs/splits/val_vis_samples.json

# caching
train_cache_rate: 0.8
val_cache_rate: 0.0
